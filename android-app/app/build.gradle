plugins {
    id 'com.android.application'
}

android {
    namespace 'com.swing.vocab'
    compileSdk 34

    defaultConfig {
        applicationId "com.swing.vocab"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
